# Pharma Vault on a single VPS, published through a Cloudflare Tunnel.
#
#   cloudflared ──► app ──► mysql          (+ backup: a daily mysqldump of mysql)
#
# Nothing is published on the host: the only way in from the internet is the tunnel, so the VPS needs
# no open web ports (keep SSH). Setup and day-to-day commands: docs/DEPLOYMENT.md.
#
#   cp .env.production.example .env.production      # then fill it in
#   docker compose --env-file .env.production -f compose.prod.yaml up -d --build

name: pharma-vault

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pharma_vault}
      MYSQL_USER: ${MYSQL_USER:-pharma_vault}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --mysqlx=OFF
      - --max-connections=100
    volumes:
      - mysql_data:/var/lib/mysql
      # runs once, on the very first start (an empty data volume), and creates every table
      - ./database/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: pharma-vault:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # one proxy (cloudflared) in front: needed so the secure session cookie and the client address
      # are read from the forwarded headers
      TRUST_PROXY: 1
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      EXPIRY_BUFFER_DAYS: ${EXPIRY_BUFFER_DAYS:-0}
      REGISTER_VARIANCE_THRESHOLD: ${REGISTER_VARIANCE_THRESHOLD:-50.00}
      # empty = the integration endpoint is off
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pharma_vault}
      MYSQL_USER: ${MYSQL_USER:-pharma_vault}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/up').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloudflared:
    image: cloudflare/cloudflared:latest # pin a release tag once you have a version you trust
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env.production}
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pharma_vault}
      MYSQL_USER: ${MYSQL_USER:-pharma_vault}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups

volumes:
  mysql_data:
